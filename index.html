<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Data & AI Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="outer-glow-container"></div>

    <main class="portfolio-frame">
        
        <header class="header-nav">
            <div class="status">
                <span class="status-dot"></span>
                <span>Active 4th Year Student | Open to Data/AI Roles</span>
            </div>
            <nav class="nav-links">
                <a href="#projects">Projects <span class="count">[15]</span></a>
                <a href="#stack">Stack</a>
                <a href="#research">Research</a>
                <a href="#contact">Contact</a>
            </nav>
            <button class="cta-btn primary-btn">Let's Connect ↗</button>
        </header>

    <section class="hero-content">
            <h1 class="hero-name big-text">
                <span class="first-name outline-text">BINARA</span>
                <span class="last-name filled-text">HANSAKA</span>
            </h1>
            
            <div class="portrait-wrapper">
                <img src="D:\advanced-portfolio\my-portrait.png.png" alt="Your Portrait" class="grayscale-portrait">
                </div>
        </section>

        <footer class="bottom-info">
            <div class="bio-block">
                <h2>Data Science & AI Engineer</h2>
                <p>Architecting robust ETL pipelines, optimizing distributed systems, and deploying predictive machine learning models at scale.</p>
                <button class="cta-btn secondary-btn">View My Tech Stack</button>
            </div>
            
            <aside class="social-links">
                <a href="YOUR_LINKEDIN_URL" class="social-item" target="_blank">
                    <img src="https://img.icons8.com/m_rounded/32/FFFFFF/linkedin.png" alt="LinkedIn" /> LinkedIn
                </a>
                <a href="YOUR_GITHUB_URL" class="social-item" target="_blank">
                    <img src="https://img.icons8.com/m_rounded/32/FFFFFF/github.png" alt="GitHub" /> GitHub
                </a>
                <a href="YOUR_KAGGLE_URL" class="social-item" target="_blank">
                    <img src="https://img.icons8.com/m_rounded/32/FFFFFF/kaggle.png" alt="Kaggle" /> Kaggle
                </a>
                <a href="#contact" class="social-item">
                    <img src="https://img.icons8.com/m_rounded/32/FFFFFF/email.png" alt="Email" /> Contact
                </a>
            </aside>
        </footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
